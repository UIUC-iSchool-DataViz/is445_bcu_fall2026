    name: GaoZheng Liu
    email: gl11@illinois.edu
    office: online
    office_hours: Mondays 3-4pm & Wednesdays 1-4pm
  -
    name: Lucian Li
    email: zilul2@illinois.edu
    office: online
    office_hours: Tuesdays & Thursdays, 3-5pm
  -
    name: Xinhui Hu
    email: xhu15@illinois.edu
    office: online
    office_hours: Mondays & Fridays, 9:30-11:30am

# Class-wide due dates.  Only the lecture slides use these (via the DUE_*
# placeholders above) -- they are deliberately not shown on any other page.
# TODO Fall 2026: these are still the Spring dates.
# note: When you add the Part 3 placeholders, a name that is the start of a longer one has to be replaced after the longer one. For example, DUE_FINAL_PART3_FEEDBACK must be replaced before DUE_FINAL_PART3, the same as COURSE_SLACK_INVITE before COURSE_SLACK
due_dates:
  final_signup: Nov 6    # final project group sign-up closes
  final_part1: Nov 17     # Part 1: Viz for Self (individual)
  final_part2: Dec 1     # Part 2: Viz for Peers (group)
  final_part3: Dec 4 (for feedback), Dec 15 (final)   # Part 3: Viz for Others

course:
  name: Data Visualization
  number: IS445
  semester: Fall 2026
  section: BU
  location: see Canvas
  time: see Canvas
  credit_hours: 4

# Semester links.  `id` is how templates and slide placeholders find an entry;
# `name` is the label shown in the syllabus table.  Entries with no `url:` are
# derived from _config.yml (url + baseurl + githuburlbase) -- do not add a url
# to those, or the repo name ends up written down twice.
urls:
  -
    id: slack
    name: Slack
    url: https://is445-bu-fa26.slack.com
    # workspace name students type when joining, and the shared-invite link
    workspace: is445-bu-fa26
    invite: https://is445-bu-fa26.slack.com
  -
    id: canvas
    name: Canvas
    url: https://canvas.illinois.edu/courses/70829
  -
    id: prairielearn
    name: PrairieLearn
    # TODO Fall 2026: still points at the Spring 2026 course instance
    url: https://us.prairielearn.com/pl/course_instance/225607/assessments
  -
    id: webpage
    name: Course Materials
    # url derived from _config.yml: {{ site.url }}{{ site.baseurl }}
  -
    id: github
    name: Github
    # url derived from _config.yml: https://github.com/{{ site.githuburlbase }}{{ site.baseurl }}

# ============================================================================
# CHANGE THESE EVERY SEMESTER (part 2 of 2)
#
# This file is the single source of truth for who is teaching, what the course
# is called, and every semester-specific link EXCEPT the course webpage and the
# GitHub repo -- those two are derived from `baseurl` in _config.yml so the
# semester repo name is only ever typed in one place.
#
# How to use these values:
#
#   * regular pages (index.md, syllabus.md, week*/index.md, _includes, _layouts):
#     Liquid works, so read them directly --
#       {{ site.data.class.course.semester }}
#       {% for ta in site.data.class.tas %}{{ ta.name }}{% endfor %}
#       {% assign canvas = site.data.class.urls | where: "id", "canvas" | first %}
#       {{ canvas.url }}
#
#   * lecture slides (week*/lecture*.md):
#     Liquid does NOT work there (reveal.js gets the raw markdown), so use the
#     ALL-CAPS placeholders that _layouts/lecture.html substitutes --
#       COURSE_WEBPAGE  COURSE_GITHUB    COURSE_NAME       COURSE_NUMBER
#       COURSE_SEMESTER COURSE_SECTION   COURSE_CANVAS     COURSE_PRAIRIELEARN
#       COURSE_SLACK    COURSE_SLACK_INVITE                COURSE_SLACK_WORKSPACE
#       COURSE_STAFF    (instructor + all TAs w/ office hours, as a markdown list)
#       COURSE_TAS      (comma-separated list of TA names)
#       INSTRUCTOR_NAME INSTRUCTOR_EMAIL INSTRUCTOR_OFFICE_HOURS
#       DUE_FINAL_SIGNUP DUE_FINAL_PART1 DUE_FINAL_PART2 DUE_FINAL_PART3
#                       (final project due dates, from `due_dates:` below)
#     To add a new placeholder, add one `replace:` line in _layouts/lecture.html.
# ============================================================================

instructor:
  name: Jill Naiman
  email: jnaiman@illinois.edu
  office: Online
  office_hours: Thursdays, 10:30am-11:30am

# Add/remove TAs here only -- the syllabus table and the lecture slides both
# build their lists from this one.
tas:

# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
# ============================================================================
# CHANGE THESE EVERY SEMESTER (part 1 of 2)
#
# This block is the *only* place the semester's repo name lives.  Everything
# else (course webpage URL, GitHub URL) is derived from it:
#
#   course webpage : {{ site.url }}{{ site.baseurl }}
#   course repo    : https://github.com/{{ site.githuburlbase }}{{ site.baseurl }}
#
# In lecture slides, use the COURSE_WEBPAGE / COURSE_GITHUB placeholders
# instead (Liquid is not rendered inside slide bodies -- see _layouts/lecture.html).
#
# The other half of the per-semester settings (people, Canvas, Slack,
# PrairieLearn, dates) lives in _data/class.yml.
#
# NOTE: _config.yml is NOT reloaded by `jekyll serve` -- restart after editing.
# ============================================================================
title: IS445 - Data Viz - BCU
email: jnaiman@illinois.edu
description: >- # this means to ignore newlines until "baseurl:"
  This is the course website for IS445-BCU in Fall 2026
githuburlbase: "UIUC-iSchool-DataViz"     # GitHub org that owns the course repo
baseurl: "/is445_bcu_fall2026"            # repo name / subpath of the site
url: "https://uiuc-ischool-dataviz.github.io"  # hostname & protocol, NO trailing slash
repository: "UIUC-iSchool-DataViz.github.io/is445_bcu_fall2026"  # keep in sync with baseurl
github_username:  jnaiman
branch: master
port: 4009
# ============================================================================

# Build settings
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
#theme: jekyll-theme-dinky
#theme: jekyll-theme-awesome
remote_theme: pages-themes/dinky@v0.2.0
plugins:

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
 - "*/inClass/*"
 - "*/inClassJekyll/*"
 - "*/prepJekyll/*"
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
#
defaults:
  -
    scope:
      path: "lecture*.md"
    values:
      layout: "lecture.html"
  -
    scope:
      path: ""
    values:
      tags: []
